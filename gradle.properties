pluginGroup = com.pino
pluginVersion = 0.0.1

# Lower bound of supported IDEs; no upper bound.
pluginSinceBuild = 242

# Compile against the lowest supported platform so newer-only APIs fail the build.
platformType = IC
platformVersion = 2024.2

# 2024.2 - 2026.1 run on Java 21.
javaVersion = 21

org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
